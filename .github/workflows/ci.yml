# Contrôles sans GPU : ce que tout contributeur peut rejouer. Les tests marqués « gpu » (exclus par
# défaut, voir pyproject.toml) exigent une carte NVIDIA et les poids : ils se jouent à la main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Dépendances (verrou figé, sans l'extra idol ni torch)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check
      - name: Formatage
        run: uv run ruff format --check
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Tests
        run: uv run pytest -rs
      - name: Avis de sécurité des dépendances API
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt --output-file /tmp/hephaistos-api-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r /tmp/hephaistos-api-requirements.txt


  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - name: Vérifier les types API depuis le backend (sans service ni secret)
        run: npm run api:check
      - name: Avis de sécurité frontend (y compris développement)
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      # Les types de routes (LayoutProps…) sont engendrés par Next : sans eux, tsc échoue.
      - name: Types
        run: npx next typegen && npx tsc --noEmit
      - name: Tests unitaires frontend
        run: npm test

  # Pile complète avec l'adaptateur factice : ni GPU, ni poids, ni secret.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Navigateur et bibliothèques système déjà présents : aucun apt ni téléchargement de Chromium au
    # moment du test (des miroirs Ubuntu injoignables bloquaient l'étape). La version DOIT égaler celle
    # de @playwright/test ; Renovate les met à jour ensemble (renovate.json).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Dépendances du backend
        working-directory: backend
        run: uv sync --frozen
      - run: npm ci
      - name: Parcours de bout en bout
        run: npm run e2e
