# Contrôles sans GPU : ce que tout contributeur peut rejouer. Les tests marqués « gpu » (exclus par
# défaut, voir pyproject.toml) exigent une carte NVIDIA et les poids : ils se jouent à la main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Dépendances (verrou figé, sans l'extra idol ni torch)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check
      - name: Formatage
        run: uv run ruff format --check
      - name: Types (mypy strict)
        run: uv run mypy
      # A5.5 : 85 % hors adaptateur Idol (seuil dans pyproject.toml), puis 95 % pour le domaine et la file.
      - name: Tests et couverture
        run: uv run pytest -rs --cov --cov-report=term
      - name: Couverture du domaine et de la file (A5.5)
        run: uv run coverage report --include="*/hephaistos/domain/*,*/hephaistos/queue/*" --fail-under=95
      - name: Avis de sécurité des dépendances API
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt --output-file /tmp/hephaistos-api-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r /tmp/hephaistos-api-requirements.txt


  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - name: Vérifier les types API depuis le backend (sans service ni secret)
        run: npm run api:check
      - name: Avis de sécurité frontend (y compris développement)
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      # Les types de routes (LayoutProps…) sont engendrés par Next : sans eux, tsc échoue.
      - name: Types
        run: npx next typegen && npx tsc --noEmit
      - name: Tests unitaires frontend
        run: npm test

  # Construction des images de production (sans publication) : ce que `docker compose build` fera sur l'hôte.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image api (API, janitor, migrations)
        run: docker build -f deploy/backend.Dockerfile --target api -t hephaistos3d/api:ci .
      - name: Image frontend
        run: docker build -f deploy/frontend.Dockerfile -t hephaistos3d/frontend:ci .
      - name: Démarrage à vide de l'image api (import et migrations sur une base jetable)
        run: |
          docker run --rm --read-only --tmpfs /data:uid=1000,gid=1000 -e HEPHAISTOS_DATA_DIR=/data \
            hephaistos3d/api:ci sh -c 'mkdir -p /data/db && alembic upgrade head && python -c "import hephaistos.api.app, hephaistos.janitor.service"'

  # Image worker à part : torch CUDA pèse plusieurs Go, il faut d'abord libérer le disque du runner.
  # Aucun GPU ici : on vérifie la construction et l'import du superviseur (qui n'importe pas torch).
  image-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Libérer le disque du runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image worker
        run: docker build -f deploy/backend.Dockerfile --target worker -t hephaistos3d/worker:ci .
      - name: Import du superviseur dans l'image
        run: docker run --rm hephaistos3d/worker:ci python -c "import hephaistos.worker.supervisor"
      - run: df -h /

  # Pile complète avec l'adaptateur factice : ni GPU, ni poids, ni secret.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Navigateur et bibliothèques système déjà présents : aucun apt ni téléchargement de Chromium au
    # moment du test (des miroirs Ubuntu injoignables bloquaient l'étape). La version DOIT égaler celle
    # de @playwright/test ; Renovate les met à jour ensemble (renovate.json).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Dépendances du backend
        working-directory: backend
        run: uv sync --frozen
      - run: npm ci
      - name: Parcours de bout en bout
        run: npm run e2e
